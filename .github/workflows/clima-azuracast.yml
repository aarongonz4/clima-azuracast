# Guardar este archivo en tu repo de GitHub como:
#   .github/workflows/clima-azuracast.yml
#
# Antes de activarlo, cargar los Secrets en:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   SFTP_HOST, SFTP_PORT, SFTP_USER, SFTP_PASS, SFTP_REMOTE_DIR

name: Clima AzuraCast

on:
  schedule:
    # Corre cada 1 hora, en el minuto 17 (en UTC). El minuto 0 está saturado
    # a nivel mundial en GitHub Actions, así que usamos un minuto menos pedido
    # para reducir demoras y ejecuciones salteadas.
    - cron: "17 * * * *"
  workflow_dispatch: {}  # permite ejecutarlo manualmente desde GitHub para probar

jobs:
  actualizar-clima:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script de clima
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
        run: python clima_azuracast.py
