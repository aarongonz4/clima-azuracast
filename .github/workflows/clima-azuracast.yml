name: Clima AzuraCast

on:
  workflow_dispatch: {}

jobs:
  actualizar-clima:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Crear archivo de credenciales de Google
        run: |
          cat << 'EOF' > google_credentials.json
          ${{ secrets.GCP_CREDENTIALS }}
          EOF

      - name: Ejecutar script de clima
        env:
          GOOGLE_APPLICATION_CREDENTIALS: google_credentials.json
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
        run: python clima_azuracast.py
