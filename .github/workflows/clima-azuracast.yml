name: Clima AzuraCast

on:
  workflow_dispatch: {}

jobs:
  actualizar-clima:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: NOGARADIO
            nombre: "Nogaradio"
          - id: REDIMIDOS
            nombre: "Radio Redimidos por Jesús"
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script de clima (${{ matrix.nombre }})
        env:
          NOMBRE_EMISORA: ${{ matrix.nombre }}
          VELOCIDAD_VOZ: "+5%"
          SFTP_HOST: ${{ secrets[format('SFTP_HOST_{0}', matrix.id)] }}
          SFTP_PORT: ${{ secrets[format('SFTP_PORT_{0}', matrix.id)] }}
          SFTP_USER: ${{ secrets[format('SFTP_USER_{0}', matrix.id)] }}
          SFTP_PASS: ${{ secrets[format('SFTP_PASS_{0}', matrix.id)] }}
          SFTP_REMOTE_DIR: ${{ secrets[format('SFTP_REMOTE_DIR_{0}', matrix.id)] }}
        run: python run_emisora.py
