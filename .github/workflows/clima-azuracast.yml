name: Clima AzuraCast

on:
  workflow_dispatch: {}

jobs:
  actualizar-clima:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # si falla una emisora, la otra igual se actualiza
      matrix:
        include:
          - id: NOGARADIO
            nombre: "Nogaradio"
            motor: "google"      # voces de Google Cloud (es-US Neural2)
          - id: REDIMIDOS
            nombre: "Radio Redimidos por Jesús"
            motor: "edge"        # voces de Microsoft Edge (es-AR Elena y Tomás), gratis
            solo_clima: "1"      # sin noticias: solo clima y "seguimos escuchando..."
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Crear archivo de credenciales de Google
        if: matrix.motor == 'google'
        env:
          GCP_JSON: ${{ secrets.GCP_CREDENTIALS }}
        run: echo "$GCP_JSON" > google_credentials.json

      # Nogaradio usa los secrets viejos (SFTP_HOST, SFTP_PORT, ...) si no existen los de _NOGARADIO.
      # Redimidos usa solo los suyos (_REDIMIDOS), así nunca sube al servidor equivocado.
      - name: Ejecutar script de clima (${{ matrix.nombre }})
        env:
          MOTOR_VOZ: ${{ matrix.motor }}
          GOOGLE_APPLICATION_CREDENTIALS: google_credentials.json
          NOMBRE_EMISORA: ${{ matrix.nombre }}
          VELOCIDAD_VOZ: "+5%"
          SOLO_CLIMA: ${{ matrix.solo_clima }}
          SFTP_HOST: ${{ secrets[format('SFTP_HOST_{0}', matrix.id)] || (matrix.id == 'NOGARADIO' && secrets.SFTP_HOST) || '' }}
          SFTP_PORT: ${{ secrets[format('SFTP_PORT_{0}', matrix.id)] || (matrix.id == 'NOGARADIO' && secrets.SFTP_PORT) || '' }}
          SFTP_USER: ${{ secrets[format('SFTP_USER_{0}', matrix.id)] || (matrix.id == 'NOGARADIO' && secrets.SFTP_USER) || '' }}
          SFTP_PASS: ${{ secrets[format('SFTP_PASS_{0}', matrix.id)] || (matrix.id == 'NOGARADIO' && secrets.SFTP_PASS) || '' }}
          SFTP_REMOTE_DIR: ${{ secrets[format('SFTP_REMOTE_DIR_{0}', matrix.id)] || (matrix.id == 'NOGARADIO' && secrets.SFTP_REMOTE_DIR) || '' }}
        run: python run_emisora.py
